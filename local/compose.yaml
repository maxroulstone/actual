name: actual-local

services:
  actual:
    image: actualbudget/actual-server:latest
    ports:
      - "5006:5006"
    volumes:
      - ./data/actual:/data
    networks:
      - actual-net

  caddy:
    image: caddy:alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks:
      - actual-net

  hornbill:
    build: ../src/hornbill
    environment:
      DB_PATH: /data/truelayer.db
      ZAZU_URL: http://zazu:3000
      TRUE_LAYER_CLIENT_ID: ${TRUE_LAYER_CLIENT_ID:-}
      TRUE_LAYER_CLIENT_SECRET: ${TRUE_LAYER_CLIENT_SECRET:-}
      TRUELAYER_AUTH_BASE_URL: ${TRUELAYER_AUTH_BASE_URL:-https://auth.truelayer-sandbox.com}
      TRUELAYER_API_BASE_URL: ${TRUELAYER_API_BASE_URL:-https://api.truelayer-sandbox.com}
      TRUELAYER_MONZO_PROVIDER_ID: ${TRUELAYER_MONZO_PROVIDER_ID:-}
      TRUELAYER_BARCLAYS_PROVIDER_ID: ${TRUELAYER_BARCLAYS_PROVIDER_ID:-}
      TRUELAYER_AMEX_PROVIDER_ID: ${TRUELAYER_AMEX_PROVIDER_ID:-}
      TRUELAYER_REDIRECT_URI: ${TRUELAYER_REDIRECT_URI:-http://localhost:8080/api/truelayer/callback}
      ADMIN_TOKENS_URL: ${ADMIN_TOKENS_URL:-http://localhost:8080/budget/tokens}
    volumes:
      - ./data/hornbill:/data
    networks:
      - actual-net

  admin:
    build: ../src/admin
    environment:
      PORT: 3000
    networks:
      - actual-net

  zazu:
    build: ../src/zazu
    environment:
      PORT: 3000
      ACTUAL_URL: http://actual:5006
      BUDGET_ID: ${BUDGET_ID:-}
      FILE_PASSWORD: ${FILE_PASSWORD:-}
    volumes:
      - ./data/zazu:/app/data
    networks:
      - actual-net

networks:
  actual-net:
