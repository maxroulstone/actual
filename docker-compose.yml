services:
  actual:
    image: actualbudget/actual-server:26.7.0
    container_name: actual_server
    ports:
      - "5006:5006"
    volumes:
      - ./actual-data:/data
    restart: unless-stopped
    networks:
      - actual-net

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    env_file:
      - .env
    networks:
      - actual-net

  hornbill:
    image: ghcr.io/maxroulstone/actual-hornbill:latest
    container_name: hornbill
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ZAZU_URL=http://zazu:3000
    volumes:
      - ./hornbill-data:/data
    networks:
      - actual-net

  admin:
    image: ghcr.io/maxroulstone/actual-admin:latest
    container_name: budget_admin
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - actual-net

  zazu:
    image: ghcr.io/maxroulstone/actual-zazu:latest
    container_name: zazu
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ACTUAL_URL=http://actual:5006
      - BUDGET_ID=${BUDGET_ID}
      - FILE_PASSWORD=${FILE_PASSWORD}
    volumes:
      - ./zazu-data:/app/data
    networks:
      - actual-net

networks:
  actual-net:
